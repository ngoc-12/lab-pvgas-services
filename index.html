<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAB PVGAS Services</title>
<meta name="description" content="Nhập số liệu QTG, tính độ không đảm bảo đo và xuất chứng chỉ hiệu chuẩn PT, PS, PG, TS, TT, RTD.">
<meta name="theme-color" content="#f5f4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LAB PVGAS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f4ee; --surface:#fffefa; --sunk:#efede4; --ink:#1f1e1b; --muted:#6f6b60; --line:#e3dfd3;
  --clay:#c96442; --clay-soft:#f6e3da; --clay-ink:#ffffff; --result:#fbf3ee;
  --ok:#3f7d4e; --warn:#a46412; --bad:#b4442f;
  --f-head:"Iowan Old Style","Palatino Linotype",Charter,Georgia,"Times New Roman",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --tabbar-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302e; --sunk:#1f1e1d; --ink:#f0eee6; --muted:#a8a498; --line:#45443f;
  --clay:#d97757; --clay-soft:#4a3329; --clay-ink:#1f1e1d; --result:#3a2e28;
  --ok:#7cc08c; --warn:#e8a650; --bad:#f08a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302e; --sunk:#1f1e1d; --ink:#f0eee6; --muted:#a8a498; --line:#45443f;
  --clay:#d97757; --clay-soft:#4a3329; --clay-ink:#1f1e1d; --result:#3a2e28;
  --ok:#7cc08c; --warn:#e8a650; --bad:#f08a72; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-ui);-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
header.top h1{margin:0;font:600 19px var(--f-head)}
header.top small{color:var(--muted)}
header.top .me{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 12px var(--f-ui);cursor:pointer;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .me span{color:var(--muted);margin-left:4px}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px 16px;overflow:auto}
#auth[hidden]{display:none}
#auth .authbox{width:100%;max-width:380px;background:var(--card,var(--sunk));border:1px solid var(--line);border-radius:14px;padding:20px}
#auth h1{margin:0 0 10px;font:600 20px var(--f-head)}
#auth label{display:block;margin:10px 0;font:500 13px var(--f-ui);color:var(--muted)}
#auth input,#auth select{display:block;width:100%;margin-top:4px;box-sizing:border-box}
#auth .btn{width:100%;margin-top:8px}
#auth .err{color:var(--bad);min-height:1em;margin:8px 0 0}
body.locked main,body.locked nav{display:none}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card.hl{border-color:var(--clay)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.phimg{aspect-ratio:4/3;background:var(--sunk);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:13px}
.phimg img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph .btns{margin:0}
.ph input{font-size:14px;padding:6px 8px}
.card h2{margin:0 0 12px;font:600 16px var(--f-head);display:flex;align-items:center;gap:8px}
.card h2 i{font-style:normal;background:var(--clay);color:var(--clay-ink);width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 12px var(--f-ui)}
.card h2 small{color:var(--muted);font:400 12px var(--f-ui)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide,.hint.wide{grid-column:1/-1}
.f span{font-size:12px;color:var(--muted)}
input,select{width:100%;min-width:0;font:16px var(--f-ui);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 10px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:41px}
input:focus,select:focus{outline:2px solid var(--clay);outline-offset:0;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:9px;padding:9px 6px;font:500 13.5px var(--f-ui);cursor:pointer}
.seg button.on{background:var(--clay);border-color:var(--clay);color:var(--clay-ink)}
.pm{display:flex;gap:4px;min-width:0}
.pm input{flex:1;min-width:0}
.pmb{flex:0 0 auto;width:40px;border:1px solid var(--line);background:var(--surface);color:var(--clay);border-radius:9px;font:600 17px var(--f-ui);cursor:pointer}
.pmb.sm{width:30px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:11px;padding:8px 6px;text-align:left;font:14px var(--f-ui);cursor:pointer;display:flex;flex-direction:column}
.chip small{color:var(--muted);font-size:11px}
.chip.on{background:var(--clay);border-color:var(--clay);color:var(--clay-ink)}
.chip.on small{color:var(--clay-ink);opacity:.85}
.chip:disabled{opacity:.45;cursor:default}
table.entry{width:100%;border-collapse:collapse}
table.entry th{font:600 11.5px var(--f-ui);color:var(--muted);padding:4px;text-align:center}
table.entry td{padding:3px}
table.entry td.n{width:26px;text-align:center;color:var(--muted)}
table.entry td.mut{text-align:center;font:13px var(--f-num);color:var(--muted)}
table.entry input{font-family:var(--f-num);text-align:center;padding:9px 4px}
table.entry.tt{min-width:500px}table.entry.tt td.n{width:auto}table.entry.tt td.n .pm{min-width:86px}
table.entry.tt tr.sep td{border-bottom:1px solid var(--line,#ddd);padding-bottom:6px}
.xs{overflow-x:auto}table.entry.rtd{min-width:520px}table.entry.rtd td.n{width:44px;font-size:12px}table.entry.rtd input{padding:9px 2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:10px 13px;font:500 14px var(--f-ui);cursor:pointer}
.btn.pri{background:var(--clay);border-color:var(--clay);color:var(--clay-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.mut{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
ul.msgs{margin:0 0 10px;padding-left:18px;font-size:13.5px}
.verdict{border-radius:12px;padding:12px 14px;font:700 18px var(--f-head);margin-bottom:10px;display:flex;flex-direction:column}
.verdict small{font:400 13px var(--f-ui);margin-top:3px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.verdict.ko{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
table.mini{width:100%;border-collapse:collapse;font:13px var(--f-num)}
table.mini th{font:600 11.5px var(--f-ui);color:var(--muted);text-align:right;padding:4px}
table.mini td{text-align:right;padding:4px;border-top:1px solid var(--line)}
details{margin-top:10px} summary{cursor:pointer;color:var(--clay);font-weight:600}
.qc{font:12.5px var(--f-num);background:var(--result);border-radius:10px;padding:10px;margin-top:8px;display:grid;gap:6px;overflow-wrap:anywhere}
.rec{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rec .ra{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;background:var(--clay-soft);color:var(--clay);border-radius:6px;padding:1px 6px}
.tag.loc{background:#e8eef6;color:#2f5f8f}
.pdfready{background:var(--result);border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.pv{overflow:hidden;position:relative;background:var(--sunk);border-radius:10px}
.pv-in{transform-origin:0 0;width:794px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{height:var(--tabbar-h);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--f-ui);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--clay)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
#rq{margin-bottom:4px}
@media (max-width:380px){.grid{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- A4 document pages (always light, Times) – 2026 templates ---------- */
#render{position:fixed;left:-20000px;top:0;width:794px}
section.a4{position:relative;width:794px;height:1123px;background:#fff;color:#000;font:14px/18px "Times New Roman",Tinos,"Liberation Serif",serif;overflow:hidden;margin:0 0 12px;box-sizing:border-box}
section.a4>*{position:relative;z-index:1}
.a4 i{font-style:italic}
.a4 .red{color:#e00000}
.a4 .c{text-align:center}
.a4 .wmimg{position:absolute;z-index:0;left:115px;top:300px;width:564px;opacity:.95}
.a4 .draft{position:absolute;top:10px;left:0;right:0;text-align:center;font:700 13px Arial,sans-serif;color:#c00000;letter-spacing:.5px;z-index:3}
.a4 .cb{display:inline-block;width:11px;height:11px;border:1px solid #000;vertical-align:-1px;position:relative;background:#fff}
.a4 .cb.on::after{content:"✓";position:absolute;left:0;top:-4px;font:700 13px Arial,sans-serif}
.a4 .gap{display:inline-block;width:34px}
/* certificate */
.a4.cert{padding:36px 58px 0 56px}
.a4.cert .frame{position:absolute;z-index:2;left:30px;right:30px;top:30px;bottom:30px;border:4px double #1d4ea8;pointer-events:none}
.a4 .chdr{position:relative;padding:10px 0 7px;min-height:92px;color:#1d4ea8}
.a4 .chdr img{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:96px}
.a4 .chdr .nologo{display:none}
.a4 .chdr .t{text-align:center;font-size:15px;line-height:19px;padding-left:36px}
.a4 .chdr .b{font-weight:700}
.a4 .chdr .i{font-style:italic}
.a4 .crule{height:0;border-top:1px solid #1d4ea8;margin:0 -24px 0 -22px}
.a4.cert h1{font:700 22px "Times New Roman",Tinos,serif;color:#2b3f8f;text-align:center;margin:14px 0 0;letter-spacing:.2px}
.a4.cert h1.r{margin-top:74px}
.a4 .sub{text-align:center;font-size:14px}
.a4 .no{text-align:center;font-size:14px;margin-bottom:6px}
.a4 table.ckv{width:100%;border-collapse:collapse}
.a4 table.ckv td{vertical-align:top;padding:2px 0 3px}
.a4 table.ckv td:first-child{width:39%;padding-right:8px}
.a4 table.ckv.std td:first-child{padding-left:30px;width:39%}
.a4 table.ckv.std td{width:30.5%}
.a4 table.ckv.std.one td+td{width:61%}
.a4 .sm{font-size:13px}
.a4 .issue{width:50%;margin:8px 0 0 auto;text-align:center}
.a4 table.csig{width:100%;border-collapse:collapse;text-align:center;margin-top:4px}
.a4 table.csig td{width:50%;vertical-align:top;padding:0}
.a4 table.csig tr.sp td{height:92px;vertical-align:middle;text-align:left}
.a4 table.csig.two tr.sp td{height:100px}
.a4 .accr{width:136px;margin-left:28px}
.a4 table.cftr{position:absolute;left:34px;right:34px;bottom:34px;border-collapse:collapse;font-size:11px;line-height:1.25;width:auto}
.a4 table.cftr td{border-top:1px solid #000;padding:4px 6px;vertical-align:top}
.a4 table.cftr td.pg{width:84px;white-space:nowrap;border-right:1px solid #000;text-align:left;padding-left:8px}
.a4 .tagline{display:flex;gap:40px;margin:14px 0 6px 14px}
.a4 table.res{width:100%;border-collapse:separate;border-spacing:0;border-top:1px solid #000;border-left:1px solid #000;text-align:center;font-size:14px;line-height:17px}
.a4 table.res th,.a4 table.res td{border:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:2px 3px}
.a4 table.res th{font-weight:400;line-height:16px}
.a4 table.res td.l,.a4 table.res th.l{text-align:left}
.a4 table.cres td{padding:3px;height:18px}
.a4 .box{border:1px solid #000;border-top:0;padding:4px 8px;font-size:14px}
.a4 .box p{margin:2px 0}
.a4 .box .l{display:block;text-align:left}
.a4 ul.dash{margin:1px 0;padding-left:44px;list-style:none}
.a4 ul.dash li{position:relative}
.a4 ul.dash li::before{content:"-";position:absolute;left:-22px}
/* QTG */
.a4.qtg{padding:34px 56px 0 64px}
.a4 .qhdr{display:flex;align-items:center;gap:10px}
.a4 .qhdr img{width:94px}
.a4 .qhdr .nologo{width:94px;height:80px}
.a4 .qhdr .t{flex:1;text-align:center;font-size:15px;line-height:1.32}
.a4 .qhdr .b{font-weight:700}.a4 .qhdr .u{text-decoration:underline}
.a4.qtg h1.q{font:700 16.5px "Times New Roman",Tinos,serif;text-align:center;margin:18px 0 0}
.a4.qtg .sub,.a4.qtg .no{font-size:14.5px;margin:0}
.a4 .formcode{text-align:right;font-size:14px;margin:2px 0 6px}
.a4 table.dot{width:100%;border-collapse:collapse;font-size:13.6px;table-layout:fixed}
.a4 table.dot td{border:1px dotted #000;padding:1px 4px;vertical-align:top;line-height:17px}
.a4 table.dot td.sp2{word-spacing:2px}
.a4 table.qres{border-top:0}
.a4 table.qres th{font-size:13px}
.a4 table.qres td{height:20px}
.a4 .qnote{font-size:13px;margin-top:4px}
.a4 table.qsig{width:100%;text-align:center;margin-top:10px;border-collapse:collapse}
.a4 table.qsig td{width:50%;vertical-align:top}
.a4 table.qsig tr.sp td{height:92px}
.a4 table.qsig.u tr.sp td{height:58px}
/* uncertainty sheet */
.a4.unc{padding:34px 40px 0 44px;font-size:12px;line-height:15px}
.a4 .uhead{display:flex;justify-content:space-between;gap:10px;border-bottom:1.5px solid #000;padding-bottom:4px;margin-bottom:6px;font-size:13px}
.a4 .uhead .fc{font-size:12px;white-space:nowrap}
.a4 .ucols{display:flex;gap:12px;align-items:flex-start}
.a4 table.ukv{flex:1;border-collapse:collapse;font-size:11.4px;table-layout:fixed;width:50%}
.a4 table.ukv td:nth-child(1){width:50px}.a4 table.ukv td:nth-child(2){width:41%}.a4 table.ukv td:nth-child(4){width:40px}
.a4 table.ukv td.txt{text-align:right}
.a4 table.ukv td.num[colspan]{padding-right:44px}
.a4 table.ukv td{border-bottom:1px dotted #999;padding:1.5px 3px;vertical-align:top}
.a4 table.ukv td.ref,.a4 table.ug .ref{font:10.5px "Courier New",monospace;color:#555;white-space:nowrap}
.a4 table.ukv td.num{font-family:"Courier New",monospace;text-align:right;overflow-wrap:anywhere}
.a4 .ulbl{font-weight:700;margin:7px 0 3px}
.a4 table.ug{font-size:11px;line-height:14px}
.a4 table.ug th{font-size:10.5px;background:#f2f2f2}
.a4 table.ug td{font-family:"Courier New",monospace;font-size:10.8px;padding:2px}
.a4 table.ug td.l{font-family:"Times New Roman",serif}
.a4 table.ug td.bad{color:#c00000;font-weight:700}
.a4 table.qct td{font-size:10.4px}
.a4 .unote{font-size:11.5px;margin-top:3px}
.a4 .ufoot{position:absolute;left:44px;right:40px;bottom:20px;font-size:10px;color:#444;border-top:1px solid #999;padding-top:3px;font-style:italic}
/* ---- PG (GCN kiểm định) ---- */
.a4.cert.pg{padding:40px 50px 0 46px;font-size:14px;line-height:17px}
.a4.pg .pgwm{left:150px;top:250px;width:520px;opacity:1}
.a4.pg .frame{border:3px double #1d4ea8}
.a4 .pghdr{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;line-height:14px;text-align:center;padding-top:6px}
.a4 .pghdr img{width:66px;margin-top:12px}
.a4 .pghdr .nologo{width:66px}
.a4 .pghdr .l{flex:1.15}.a4 .pghdr .r{flex:1;font-size:12px}
.a4 .pghdr .b{font-weight:700}.a4 .pghdr .i{font-style:italic}
.a4 .pghdr .rl{width:110px;margin:3px auto 0;border-top:1px solid #000}
.a4 h1.pgt{font:700 21px "Times New Roman",Tinos,serif;color:#e8124d;text-align:center;margin:30px 0 0}
.a4 h1.pgt.r2{margin-top:64px}
.a4 .pgs{text-align:center;color:#e8124d;font-weight:700;font-style:italic;font-size:14px}
.a4 .pgs2{text-align:center;color:#e8124d;font-size:17px;margin-bottom:6px}
.a4 table.pgkv{width:100%;border-collapse:collapse;margin-top:18px}
.a4 table.pgkv td{vertical-align:top;padding:0 0 9px}
.a4 table.pgkv td:first-child{width:34%;padding-left:4px}
.a4 table.pgkv td.b{font-weight:700}.a4 table.pgkv td.b i.en{font-weight:400}
.a4 table.pgkv td.red,.a4 table.pgkv td.red i{color:#e00000}
.a4 table.pgkv .half{display:inline-block;width:60%}
.a4 .pgi{width:52%;margin:0 0 0 auto}
.a4 table.pgsig tr.sp td{height:76px}
.a4 .pgfoot{position:absolute;left:36px;bottom:36px;font-size:11px;line-height:13px}
.a4 .pgtag{margin:22px 0 4px}
.a4 table.pgr td{height:16px;padding:0 3px}
.a4 table.pgr td.pgnote{height:42px;vertical-align:middle}
.a4 table.pgsig2{margin-top:22px}
.a4 table.pgsig2 tr.sp td{height:76px}
/* ---- temperature certificates ---- */
.a4 .chdr.lab .t{font-size:14px;line-height:17px}
.a4 table.ckv.tc td{padding:1px 0 2px}
.a4 table.coef{margin:0 0 0 210px;border-collapse:collapse}
.a4 table.coef td{padding:0 0 1px}
.a4 table.tsr td{height:22px}
/* ---- QTG for PG / TS / TT / RTD ---- */
.a4.qtg.pgqtg table.dot{font-size:13px}
.a4 table.pgred{margin-top:6px;font-size:13px}
.a4 table.pgred tr.c td{text-align:center}
.a4 table.pgq td{height:22px}
.a4 table.pgkl{width:100%;margin-top:6px;font-size:13.6px;border-collapse:collapse}
.a4 table.pgkl td{vertical-align:top;padding:2px 4px}
.a4 table.pgkl td:first-child{width:40%}
.a4 table.tsq th,.a4 table.ttq th,.a4 table.rtq th{font-size:12px;line-height:14px}
